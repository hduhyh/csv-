name: Windows EXE 打包

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: 构建 Windows 单文件程序
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: 安装项目和打包依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: 运行自动化测试
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: 使用 PyInstaller 打包
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "CSV文件合并工具" `
            --collect-all openpyxl `
            gui_app.py

      - name: 检查打包结果
        shell: pwsh
        run: |
          $exePath = "dist\CSV文件合并工具.exe"
          if (-not (Test-Path $exePath)) {
            throw "未找到打包生成的 EXE：$exePath"
          }
          Get-Item $exePath | Format-List Name, Length, LastWriteTime
          Get-FileHash $exePath -Algorithm SHA256

      - name: 上传 Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CSV文件合并工具-Windows
          path: dist/CSV文件合并工具.exe
          if-no-files-found: error
          retention-days: 30
